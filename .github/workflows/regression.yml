name: Nightly regression

# Catches the failures that appear without anyone touching the repository:
# a dependency advisory, a browser update changing behaviour, or a deployed
# site that has quietly broken.
on:
  schedule:
    - cron: '30 1 * * *' # 07:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: Full suite against a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        env:
          PUBLIC_CONSULTATION_ENDPOINT: ${{ vars.PUBLIC_CONSULTATION_ENDPOINT }}
        run: npm run verify

      - run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: playwright-report/
          retention-days: 14

  live-smoke:
    name: Smoke test the live site
    runs-on: ubuntu-latest
    # Set the PRODUCTION_URL repository variable to enable this job.
    if: vars.PRODUCTION_URL != ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Smoke test
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: npx playwright test --grep @smoke --project=desktop

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Advisory only for low severity; fails the job on high or critical.
      - name: Audit
        run: npm audit --audit-level=high
