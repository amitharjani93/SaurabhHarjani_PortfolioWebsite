name: CI

# Runs on every pull request into any branch, and on every push to any branch
# other than main. Deployment of main is gated separately by deploy.yml, which
# runs the same suite before publishing.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # Surfaces changes that normally travel with a test change. Advisory on
  # purpose: a hard failure on every prose tweak would only encourage
  # throwaway tests. The signal belongs in review, not in a red X.
  test-freshness:
    name: Tests moved with the code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare source and test changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)

          changed() { echo "$CHANGED" | grep -qE "$1"; }
          note()    { echo "::warning title=Tests may need updating::$1"; echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }

          echo "### Test freshness" >> "$GITHUB_STEP_SUMMARY"
          FLAGGED=0

          if changed '^src/(lib|services)/' && ! changed '^test/unit/'; then
            note "src/lib or src/services changed with no change under test/unit/. Pure logic is held to 90% coverage — see .github/copilot-instructions.md."
            FLAGGED=1
          fi

          if changed '^src/pages/.*\.astro$' && ! changed '^test/support/dist\.ts$'; then
            note "A page changed but expectedRoutes in test/support/dist.ts did not. A new route must be listed there and in test/e2e/routes.ts."
            FLAGGED=1
          fi

          if changed '^src/config/' && ! changed '^test/unit/(config|content)\.test\.ts$'; then
            note "src/config changed with no change to the config or content contract tests."
            FLAGGED=1
          fi

          if changed '^src/(components|layouts|styles)/' && ! changed '^test/'; then
            note "Components, layouts or styles changed with no test change. Confirm the build-output and e2e suites still describe the new behaviour."
            FLAGGED=1
          fi

          if [ "$FLAGGED" -eq 0 ]; then
            echo "Nothing to flag — tests moved with the code." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Fast feedback: fails within a minute or so on the common mistakes.
  static:
    name: Types, unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit and contract tests
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The regression suite: builds the site, asserts the output, then drives it
  # in a browser. This is the same suite the nightly run and the deploy use.
  regression:
    name: Build, output assertions and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        env:
          PUBLIC_CONSULTATION_ENDPOINT: ${{ vars.PUBLIC_CONSULTATION_ENDPOINT }}
        run: npm run build

      - name: Build-output assertions
        run: npm run test:build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
